  features_identified:
    - id: "F-001"
      name: "Motor de Regras (Camada 1)"
      description: |
        Camada determinística de custo zero para fatos e cálculos (óleo vencido,
        KM, item recusado, estoque, status OS, financeiro, comissão).
      user_benefit: |
        - Respostas em milissegundos
        - Confiabilidade (cálculo/estoque/financeiro nunca probabilístico)
      acceptance_criteria:
        - "Fatos e cálculos resolvidos sem nenhuma chamada de LLM"
      scope: "MVP"
      priority: "HIGH"
      technical_complexity: "MEDIUM"
      dependencies: []
      created_from_brainstorm:
        session_id: "2026-07-16-arquitetura-3-camadas"
        decision_id: "DEC-001"

    - id: "F-002"
      name: "Motor de Automação (Camada 2)"
      description: |
        Workflows disparados por evento, sem IA (evento -> tarefa -> fila;
        aprovou -> libera execução -> avisa mecânico).
      user_benefit:
        - "Fluxos operacionais automáticos sem custo de IA"
      acceptance_criteria:
        - "Gatilhos e réguas executam sem chamada de LLM"
      scope: "MVP"
      priority: "HIGH"
      technical_complexity: "MEDIUM"
      dependencies: ["F-001"]
      created_from_brainstorm:
        session_id: "2026-07-16-arquitetura-3-camadas"
        decision_id: "DEC-001"

    - id: "F-003"
      name: "Roteador de Eventos Declarativo (o portão de camada)"
      description: |
        Tabela declarativa por tipo de evento que decide Camada 1/2/3. Custo zero.
        NUNCA uma chamada de LLM (cláusula 2 do ADR-001).
      user_benefit:
        - "Garante que a IA só é chamada quando agrega valor"
      acceptance_criteria:
        - "Decisão de camada é regra declarativa, auditável, sem LLM"
      scope: "MVP"
      priority: "HIGH"
      technical_complexity: "MEDIUM"
      dependencies: ["F-001"]
      created_from_brainstorm:
        session_id: "2026-07-16-arquitetura-3-camadas"
        decision_id: "DEC-001"

    - id: "F-004"
      name: "Orquestrador de IA com roteamento por skill (Camada 3)"
      description: |
        Modelo forte só para conversa com cliente e Gestor; modelo barato para
        classificação/estruturação (mantém doc 15 §3a). NÃO um modelo único.
      user_benefit:
        - "Qualidade onde importa, custo baixo no resto"
      acceptance_criteria:
        - "Cada skill roteia para o modelo configurado no admin"
        - "Uso de IA medido e registrado por tenant/agente/modelo"
      scope: "MVP"
      priority: "HIGH"
      technical_complexity: "HIGH"
      dependencies: ["F-003"]
      created_from_brainstorm:
        session_id: "2026-07-16-arquitetura-3-camadas"
        decision_id: "DEC-001"

    - id: "F-005"
